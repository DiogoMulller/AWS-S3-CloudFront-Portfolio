<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="510" viewBox="0 0 1100 510" role="img" aria-labelledby="title desc">
<title id="title">Arquitetura de portfólio estático com Amazon S3 e CloudFront</title>
<desc id="desc">Visitante acessa o CloudFront por HTTPS, e CloudFront recupera objetos de um bucket S3 privado sob controle OAC. AWS Budgets acompanha custos da conta.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#141720"/><stop offset="1" stop-color="#090b11"/></linearGradient>
  <linearGradient id="line"><stop stop-color="#f90362"/><stop offset="1" stop-color="#ff76ab"/></linearGradient>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#f90362"/></marker>
  <style>text{font-family:Arial, sans-serif;fill:#fdfdf5}.heading{font-size:26px;font-weight:700}.node{fill:#1c202b;stroke:#555b6a;stroke-width:2}.node-title{font-size:21px;font-weight:700}.small{fill:#aab0c1;font-size:15px}.label{font-size:14px;fill:#ffa6c8}.line{fill:none;stroke:url(#line);stroke-width:3;marker-end:url(#arrow)}.dash{stroke-dasharray:8 8}</style>
</defs>
<rect width="1100" height="510" rx="22" fill="url(#bg)"/>
<text x="50" y="65" class="heading">Arquitetura de hospedagem estática</text>
<text x="50" y="92" class="small">Amazon CloudFront + Amazon S3 privado • Cloud Security</text>
<rect class="node" x="50" y="175" rx="16" width="235" height="155"/>
<text x="167" y="220" class="node-title" text-anchor="middle">Visitante</text><text x="167" y="247" class="small" text-anchor="middle">Navegador</text><text x="167" y="278" class="label" text-anchor="middle">HTTPS</text>
<rect class="node" x="405" y="175" rx="16" width="265" height="155"/>
<text x="538" y="219" class="node-title" text-anchor="middle">CloudFront</text><text x="538" y="247" class="small" text-anchor="middle">CDN + cache</text><text x="538" y="279" class="label" text-anchor="middle">Endpoint público</text>
<rect class="node" x="790" y="175" rx="16" width="260" height="155"/>
<text x="920" y="219" class="node-title" text-anchor="middle">Amazon S3</text><text x="920" y="247" class="small" text-anchor="middle">Arquivos estáticos</text><text x="920" y="279" class="label" text-anchor="middle">Bucket privado</text>
<path class="line" d="M285 252 H403"/>
<path class="line" d="M670 252 H788"/>
<text x="731" y="225" class="label" text-anchor="middle">OAC</text>
<rect class="node" x="350" y="387" rx="13" width="400" height="78"/>
<text x="550" y="416" class="node-title" text-anchor="middle">AWS Budgets</text><text x="550" y="442" class="small" text-anchor="middle">Monitoramento de custos e alertas</text>
<path d="M535 330 V387" stroke="#777d8f" stroke-width="2" stroke-dasharray="6 5"/>
<text x="54" y="465" class="small">Sem EC2 • Sem bucket público • OAC restringe acesso de origem</text>
</svg>